<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Kebun vs Pejabat</title>
<style>html,body{margin:0;height:100%;background:#0e1a13;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center}.loading{text-align:center;font-weight:900}.loading small{display:block;margin-top:8px;opacity:.65;font-weight:600}</style>
</head>
<body>
<div class="loading">🌱 Loading Kebun vs Pejabat…<small>full prototype + plant leveling</small></div>
<script>
(async()=>{
  try{
    const files=[
      'gz/part-1.b64','gz/part-2.b64','gz/part-3.b64','gz/part-4.b64','gz/part-5.b64',
      'gz/part-6-1.b64','gz/part-6-2.b64','gz/part-6-3.b64'
    ];
    const parts=await Promise.all(files.map(async f=>{
      const r=await fetch(f,{cache:'no-store'});
      if(!r.ok) throw new Error(f+' '+r.status);
      return r.text();
    }));
    const raw=parts.join('').replace(/\s+/g,'');
    const bin=atob(raw);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    if(!('DecompressionStream' in window)) throw new Error('Browser belum support gzip loader. Pakai Chrome/Edge terbaru.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    document.body.innerHTML='<div class="loading">⚠️ Game gagal dimuat.<small>'+String(err)+'</small></div>';
  }
})();
</script>
</body>
</html>
