<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#173a25"><title>Kebun vs Pejabat</title><style>html,body{margin:0;height:100%;background:#0e1a13;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center}.loading{text-align:center;font-weight:900;padding:24px}.loading small{display:block;margin-top:8px;opacity:.65;font-weight:600;word-break:break-word}</style></head><body><div class="loading">🌱 Loading Kebun vs Pejabat…<small>bundle repaired</small></div><script>(async()=>{try{const files=['bundle/p1-fixed.b64','bundle/p2.b64','bundle/p3a.b64','bundle/p3b.b64','bundle/p4.b64'];const parts=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=repair3',{cache:'no-store'});if(!r.ok)throw new Error(f+' '+r.status);return r.text()}));const raw=parts.join('').replace(/\s+/g,'');const bin=atob(raw),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream'in window))throw new Error('Browser belum support gzip loader. Pakai Chrome/Edge terbaru.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(err){document.body.innerHTML='<div class="loading">⚠️ Game gagal dimuat.<small>'+String(err)+'</small></div>'}})();</script></body></html>
